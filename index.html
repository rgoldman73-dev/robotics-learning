<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Daily 30-minute modules for the free Stanford robotics curriculum. Installable, works offline." />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <title>Robot Learning Path</title>
  <script>
    // apply saved theme before first paint (avoid flash)
    try { var t = JSON.parse(localStorage.getItem('rlp.v1') || '{}').theme; if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
